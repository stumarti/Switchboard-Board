; ============================================================================
; Switchboard Board — firmware for the Seeed reTerminal E1004
; (13.3" Spectra 6 colour e-paper, 1200x1600, ESP32-S3, 8 MB PSRAM)
;
; A big Switchboard wall display. Everything but the hardware comes from
; Switchboard Viewport (the viewport/ submodule): Wi-Fi setup, pairing, the
; server protocol, updates and every screen. This repository adds the
; E1004's panel, buttons and pins, and draws the viewport's 800x480 screens
; at twice the size, landscape.
;
;   git submodule update --init
;   pio run -e e1004 -t upload -t monitor
; ============================================================================

[platformio]
default_envs = e1004

[env:e1004]
; The same platform, board and partitions as the viewport's E1002: the
; E1004 has the same ESP32-S3 module (32 MB flash, 8 MB octal PSRAM).
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; FIRMWARE_VERSION from this repository's git tags.
extra_scripts = pre:tools/gen_version.py

; This repository's sources, then the viewport's, less the three files
; that are about the E1002's hardware (this board has its own).
build_src_filter =
    +<*>
    +<../viewport/src/>
    -<../viewport/src/app/display.cpp>
    -<../viewport/src/app/hw.cpp>

lib_extra_dirs = viewport/lib

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; The board, as Switchboard Server's updates know it.
    '-DSWITCHBOARD_BOARD="e1004"'
    -DARDUINOJSON_ENABLE_PROGMEM=1
    -DARDUINOJSON_DEFAULT_NESTING_LIMIT=32
    ; This repository's headers first: its config.h stands in for the
    ; viewport's (and includes it).
    -Isrc
    -Iviewport/src

lib_deps =
    ; Only for its colour names (GxEPD_WHITE...), which the screens draw
    ; with; this board's panel has its own driver (src/board/ed2208.cpp).
    zinggjm/GxEPD2 @ ^1.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    sensirion/Sensirion I2C SHT4x @ ^1.1.0
    sensirion/Sensirion Core @ ^0.7.1
    bblanchon/ArduinoJson @ ^7.1.0
